id = "com.chefgroep.linear-context"
name = "Linear Issue Context"
version = "0.2.0"
min_herdr_version = "0.7.3"
description = "Fetch Linear issue title/status/assignee into the Fleet Ops Bar"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "install"]

[[build]]
command = ["npm", "run", "build"]

[[actions]]
id = "fetch-issue"
title = "Fetch Linear Issue"
description = "Pull issue metadata by ID or from branch name"
contexts = ["workspace", "pane"]
command = ["node", "dist/fetch-issue.js"]

[[actions]]
id = "set-issue"
title = "Bind Issue to Workspace"
description = "Associate the Linear issue ID from the branch with the current workspace"
contexts = ["workspace"]
command = ["node", "dist/set-issue.js"]

[[actions]]
id = "list-issues"
title = "List My Open Issues"
description = "List Linear issues assigned to you that are not done"
contexts = ["workspace", "global"]
command = ["node", "dist/list-issues.js"]

[[events]]
on = "worktree.created"
command = ["node", "dist/fetch-issue.js"]

[[link_handlers]]
id = "linear-issue-url"
title = "Open Linear Issue"
pattern = "^https?://linear\\.app/[^/]+/issue/([A-Z]+-\\d+)"
action = "fetch-issue"

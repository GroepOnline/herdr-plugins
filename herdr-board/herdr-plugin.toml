id = "com.chefgroep.herdr-board"
name = "Agent Board"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Read-only view of the opencode agent message-board (open/claimed items, newest first)"
platforms = ["linux", "macos"]

[[actions]]
id = "show"
title = "Show agent board"
description = "List open/claimed board items compact, newest first (read-only; claim/post stays in opencode)"
contexts = ["global", "workspace"]
command = ["node", "src/board.js", "show"]

[[actions]]
id = "show-all"
title = "Show agent board (all statuses)"
description = "List all board items compact, newest first (read-only)"
contexts = ["global", "workspace"]
command = ["node", "src/board.js", "show-all"]

[[panes]]
id = "board"
title = "Agent Board"
placement = "split"
command = ["node", "src/board.js", "pane"]

id = "com.chefgroep.chatgpt-bridge"
name = "ChatGPT Bridge"
version = "0.2.1"
min_herdr_version = "0.7.5"
description = "Expose Herdr sessions/panes/agents as a local remote-MCP endpoint for ChatGPT (read-only by default)"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "serve"
title = "Serve MCP bridge"
description = "Start or reuse the managed MCP server on 127.0.0.1:8791 (CHEF_CHATGPT_PORT to override)"
contexts = ["global"]
command = ["node", "src/mcp-server.js", "serve"]

[[actions]]
id = "status"
title = "Bridge status"
description = "Show tool inventory, write-gate state and herdr reachability"
contexts = ["global", "workspace"]
command = ["node", "src/mcp-server.js", "doctor"]

[[actions]]
id = "capture-focused"
title = "Capture focused agent output"
description = "Save bounded and redacted output from the focused Herdr/Cursor agent"
contexts = ["global", "workspace", "pane"]
command = ["node", "src/mcp-server.js", "capture-focused"]

[[actions]]
id = "stop"
title = "Stop bridge"
description = "Stop the managed bridge instance cleanly"
contexts = ["global"]
command = ["node", "src/mcp-server.js", "stop"]

[[panes]]
id = "bridge"
title = "ChatGPT Bridge"
placement = "tab"
command = ["node", "src/mcp-server.js", "serve-foreground"]

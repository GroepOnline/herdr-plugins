name: Plugin PR gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifests vs package.json vs registry
        run: python3 scripts/validate.py
      - name: Syntax-check JS plugin sources
        run: |
          fail=0
          for f in */src/index.js chatgpt-bridge/src/mcp-server.js; do
            [ -f "$f" ] || continue
            node --check "$f" || fail=1
          done
          exit $fail
      - name: chatgpt-bridge capture selftest
        run: node chatgpt-bridge/src/mcp-server.js selftest
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [chef-github-status, chef-linear-context, kater-bridge, chef-pane-reaper]
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test Kater Bridge lock recovery
        if: matrix.plugin == 'kater-bridge'
        run: npm test
